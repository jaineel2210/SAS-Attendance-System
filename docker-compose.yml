version: '3.8'

services:
  web:
    build: .
    container_name: secureattend-pro
    ports:
      - "8000:8000"
    environment:
      - FLASK_ENV=production
      - DEBUG=False
      - MYSQL_HOST=db
      - MYSQL_USER=secureattend
      - MYSQL_PASSWORD=secureattend_password
      - MYSQL_DATABASE=attendance_system
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-this}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./static/uploads:/app/static/uploads
      - ./static/face_images:/app/static/face_images
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - secureattend-network

  db:
    image: mysql:8.0
    container_name: secureattend-db
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=attendance_system
      - MYSQL_USER=secureattend
      - MYSQL_PASSWORD=secureattend_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    restart: unless-stopped
    networks:
      - secureattend-network

  nginx:
    image: nginx:alpine
    container_name: secureattend-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/usr/share/nginx/html/static:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - secureattend-network

volumes:
  mysql_data:

networks:
  secureattend-network:
    driver: bridge
